name: Release Push

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  create-release:
    if: github.event.pull_request.merged && github.event.pull_request && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 设置 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 设置 Node.js 环境，版本为 18
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # 获取 pnpm 的存储目录路径
      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      # 设置 pnpm 缓存
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          # 缓存路径
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          # 缓存键
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          # 恢复缓存的备用键
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: get version
        id: get-current-version
        run: |
          data=$(cat package.json)
          re="\"version\": \"([^\"]*)\""
          [[ $data =~ $re ]]
          echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT

      - name: Read CHANGELOG.md
        id: read-changelog
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const version = "${{ steps.get-current-version.outputs.version }}"
            
            try {
              const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
              const versionHeader = `## ${version}`;
              const startIndex = changelog.indexOf(versionHeader);
              
              if (startIndex === -1) {
                console.log(`Version ${version} not found in CHANGELOG.md`);
                return { content: null };
              }
              
              const nextVersionIndex = changelog.indexOf('## ', startIndex + 2);
              const releaseNotes = nextVersionIndex === -1
                ? changelog.slice(startIndex)
                : changelog.slice(startIndex, nextVersionIndex);
              
              return { content: releaseNotes.trim() };
            } catch (error) {
              console.error(`Error reading CHANGELOG.md: ${error}`);
              return { content: null };
            }

      # 安装依赖
      - run: pnpm install --no-frozen-lockfile

      - name: Build WESLEY version
        run: pnpm run open:build

      - name: Create WESLEY zip
        run: |
          VERSION=$(echo ${{ github.ref_name }} | sed 's/\./_/g' | sed 's/-/_/g')
          zip -r MTB-OA-WESLEY-BuildPackage-$VERSION.zip dist/*

      - name: Build HMH version
        run: pnpm run hmh:build

      - name: Create HMH zip
        run: |
          VERSION=$(echo ${{ github.ref_name }} | sed 's/\./_/g' | sed 's/-/_/g')
          zip -r MTB-OA-HMH-BuildPackage-$VERSION.zip dist/*

      - name: Build default version
        run: pnpm run build

      - name: Create default zip
        run: |
          VERSION=$(echo ${{ github.ref_name }} | sed 's/\./_/g' | sed 's/-/_/g')
          zip -r MTB-OA-BuildPackage-$VERSION.zip dist/*

      - name: Create Release
        uses: actions/github-script@v6
        with:
          script: |
            const version = "${{ steps.get-current-version.outputs.version }}"
            
            let releaseBody = steps.read-changelog.outputs.content;
            
            // 如果仍然没有changelog，使用默认消息
            if (!releaseBody) {
              releaseBody = `Release ${version}`;
            }
            
            // 判断是否为预发布版本（alpha或beta）
            const isPrerelease = version.includes('-alpha.') || version.includes('-beta.');
            
            // 创建release
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: `Release ${version}`,
              body: releaseBody,
              draft: false,
              prerelease: isPrerelease
            });

            // 上传构建包
            const fs = require('fs');
            const globby = require('globby');
            
            const assets = [
              `MTB-OA-WESLEY-BuildPackage-${version}.zip`,
              `MTB-OA-HMH-BuildPackage-${version}.zip`,
              `MTB-OA-BuildPackage-${version}.zip`
            ];
            
            for (const asset of assets) {
              if (fs.existsSync(asset)) {
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.data.id,
                  name: asset,
                  data: fs.readFileSync(asset)
                });
              }
            }
            
            console.log(`Created release for ${version} with assets`);

      - name: Clean up
        if: always()
        run: |
          rm -f MTB-OA-*-BuildPackage-*.zip